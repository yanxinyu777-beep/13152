<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>多角色文本转语音</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <main class="container">
    <h1>📚 多角色文本转 MP3</h1>
    <p>支持 TXT / EPUB / MOBI（MOBI 建议先转 TXT/EPUB）。</p>

    <form id="uploadForm">
      <input id="fileInput" type="file" name="file" accept=".txt,.epub,.mobi" required />
      <button type="submit">开始生成</button>
    </form>

    <section id="status" class="card">等待上传…</section>
    <section id="result" class="card hidden"></section>
  </main>

  <script>
    const form = document.getElementById('uploadForm');
    const statusEl = document.getElementById('status');
    const resultEl = document.getElementById('result');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const file = document.getElementById('fileInput').files[0];
      if (!file) return;

      const fd = new FormData();
      fd.append('file', file);
      statusEl.textContent = '处理中，可能需要几分钟…';
      resultEl.classList.add('hidden');

      try {
        const res = await fetch('/api/process', { method: 'POST', body: fd });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || '处理失败');

        const voices = Object.entries(data.voice_map)
          .map(([k,v]) => `<li><b>${k}</b> → ${v}</li>`)
          .join('');

        resultEl.innerHTML = `
          <h3>✅ 生成成功</h3>
          <p>任务ID：${data.task_id}</p>
          <p>分片数量：${data.parts.length}</p>
          <ul>${voices}</ul>
          <a class="download" href="${data.download}">下载 ZIP（包含全部 MP3）</a>
        `;
        resultEl.classList.remove('hidden');
        statusEl.textContent = '完成。';
      } catch (err) {
        statusEl.textContent = `❌ ${err.message}`;
      }
    });
  </script>
</body>
</html>
