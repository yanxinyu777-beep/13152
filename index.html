<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>区域与产业调研报告系统（可用版）</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>区域与支柱产业调研报告系统（可用版）</h1>
        <p>支持结构化信息录入、数据三重校验、图表生成、报告预览与 PDF 导出。</p>
      </header>

      <main>
        <section class="card">
          <h2>一、内容输入</h2>
          <form id="reportForm">
            <div class="grid-2">
              <label>
                目标区域
                <input id="targetRegion" type="text" placeholder="例如：深圳市南山区" required />
              </label>
              <label>
                支柱产业名称
                <input id="pillarIndustry" type="text" placeholder="例如：人工智能" required />
              </label>
            </div>

            <label>
              区域调研重点关注内容
              <textarea id="regionFocus" rows="3" required></textarea>
            </label>

            <label>
              行业调研重点关注内容
              <textarea id="industryFocus" rows="3" required></textarea>
            </label>

            <div class="grid-3">
              <label>
                第一产业增加值（亿元）
                <input id="gdpPrimary" type="number" min="0" step="0.01" required />
              </label>
              <label>
                第二产业增加值（亿元）
                <input id="gdpSecondary" type="number" min="0" step="0.01" required />
              </label>
              <label>
                第三产业增加值（亿元）
                <input id="gdpTertiary" type="number" min="0" step="0.01" required />
              </label>
            </div>

            <div class="grid-3">
              <label>
                高新技术企业数量
                <input id="highTechCount" type="number" min="0" required />
              </label>
              <label>
                瞪羚企业数量
                <input id="gazelleCount" type="number" min="0" required />
              </label>
              <label>
                代表企业数量
                <input id="repCompanyCount" type="number" min="0" required />
              </label>
            </div>

            <h3>数据三重校验（每条数据需 3 个来源）</h3>
            <div id="evidenceList"></div>
            <button type="button" class="secondary" id="addEvidenceBtn">新增一条数据校验项</button>

            <h3>关键来源（原文出处）</h3>
            <textarea id="sourceLinks" rows="4" placeholder="每行一个来源链接或出处说明" required></textarea>

            <button type="submit" id="startBtn">开始生成</button>
          </form>
        </section>

        <section class="card">
          <h2>二、等待显示</h2>
          <ul id="progressList" class="progress-list">
            <li>要求分析中 <span class="time">3S</span></li>
            <li>信息收集中 <span class="time">2-3min</span></li>
            <li>信息处理中 <span class="time">1-2min</span></li>
            <li>报告撰写中 <span class="time">1-2min</span></li>
            <li>整理输出中 <span class="time">直至结束</span></li>
          </ul>
          <div id="progressStatus" class="status">等待开始...</div>
        </section>

        <section class="card">
          <h2>三、内容输出</h2>
          <div class="output-actions">
            <button id="downloadRegionBtn" disabled>下载区域调研报告 PDF</button>
            <button id="downloadIndustryBtn" disabled>下载产业调研报告 PDF</button>
          </div>
          <p class="tip">支持先预览后下载；PDF命名：XX区域调研报告 / XX产业调研报告</p>
        </section>

        <section class="card">
          <h2>报告预览</h2>
          <div id="reportPreview" class="preview">尚未生成报告</div>
          <div class="charts">
            <canvas id="industryChart"></canvas>
            <canvas id="enterpriseChart"></canvas>
          </div>
        </section>
      </main>
    </div>

    <template id="evidenceTemplate">
      <div class="evidence-item">
        <label>数据名称 <input class="e-name" type="text" placeholder="例如：高企数量" required /></label>
        <label>数据值 <input class="e-value" type="text" placeholder="例如：1234 家" required /></label>
        <label>来源1 <input class="e-s1" type="text" placeholder="政府官网链接/公告" required /></label>
        <label>来源2 <input class="e-s2" type="text" placeholder="统计年鉴/部门报告" required /></label>
        <label>来源3 <input class="e-s3" type="text" placeholder="行业报告/年报" required /></label>
        <button type="button" class="danger remove-evidence">删除该项</button>
      </div>
    </template>

    <script src="script.js"></script>
  </body>
</html>
